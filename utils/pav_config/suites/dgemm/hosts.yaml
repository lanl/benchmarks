chicoma:
    variables:
        cpu_mathlibs:
            - { name: "openblas", module: "", version: "", blas_root: "/usr" }
            - { name: "libsci", module: "cray-libsci", version: "23.12.5", blas_root: "" }
            - { name: "intel-mkl", module: "intel-mkl", version: "2023.2.0", blas_root: "" }
        gpu_mathlibs:
            - { name: "cublas", module: "cudatoolkit", version: "12.9.0", blas_root: "${CUDA_HOME}" }
            - { name: "cublasxt", module: "cudatoolkit", version: "12.9.0", blas_root: "${CUDA_HOME}" }
crossroads:
    variables:
        cpu_mathlibs:
            - { name: "openblas", module: "", version: "", blas_root: "/usr" }
