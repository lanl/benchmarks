helios:
    variables:
        cpu_mathlibs:
            - { name: "openblas", module: "", version: "", blas_root: "/usr" }
        gpu_mathlibs:
            - { name: "cublas", module: "cudatoolkit", version: "12.9.0", blas_root: "${CUDA_HOME}" }
            - { name: "cublasxt", module: "cudatoolkit", version: "12.9.0", blas_root: "${CUDA_HOME}" }
    schedule:
        slurm:
            sbatch_extra:
                - "--cpus-per-task=16"
                - "--hint=nomultithread"
                - "--mem-per-gpu=120G"
                - "--gpus-per-task=1"
